<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtelierKit — paiement reçu</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f1ea;color:#1c1915;margin:0}main{max-width:640px;margin:40px auto;padding:28px;background:#fff;border-radius:16px}a{color:#8a5a12}</style></head>
<body><main>
<h1 id="t">Vérification du paiement</h1>
<p id="m">Stripe est interrogé. L'accès ne s'ouvre pas sur une adresse devinée.</p>
<p><a href="/">Retour à l'outil</a></p>
<script>
const session=new URLSearchParams(location.search).get("session_id");
const t=document.getElementById("t"), m=document.getElementById("m");
if(!session){
  t.textContent="Paiement non confirmé";
  m.textContent="Revenez depuis la page Stripe après le paiement.";
}else{
  fetch("/api/verify?session_id="+encodeURIComponent(session))
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(ok && j.paid){
        localStorage.setItem("ak-pro","oui");
        localStorage.setItem("ak-session",session);
        t.textContent="Paiement confirmé";
        m.textContent="L'accès s'ouvre sur cet appareil.";
        setTimeout(()=>location.href="/",800);
      }else if(j.reason==="stripe-key-missing"){
        t.textContent="Paiement reçu, confirmation en attente";
        m.textContent="La clé Stripe n'est pas encore sur ce projet. L'accès ne s'ouvre pas tant qu'elle n'est pas branchée.";
      }else{
        t.textContent="Paiement non confirmé";
        m.textContent="Stripe n'a pas confirmé cette session. L'accès reste fermé.";
      }
    })
    .catch(()=>{ t.textContent="Vérification impossible"; m.textContent="Réessayez dans un moment."; });
}
</script>
</main></body></html>
